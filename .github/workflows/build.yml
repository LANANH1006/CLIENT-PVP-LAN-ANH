name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir work && unzip -qo lananh-client-source-no-shader.zip -d work
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Build
        working-directory: work
        run: gradle build --no-daemon 2>&1 | tee ../build.log
      - name: Xem jar
        run: ls -la work/build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: LanAnhClient-jar
          path: work/build/libs/lananh-client-*.jar
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
